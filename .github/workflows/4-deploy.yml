# ④ 実装・公開: main にマージされたらサイトを生成して GitHub Pages に公開
name: 4. 公開
on:
  push:
    branches: [main]
    paths: ["content/**", "affteam/build.py", "config.yaml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  # サイトを作ってアップロードするジョブと、公開するジョブを分ける（GitHub公式の標準の形）。
  # 同じジョブ内でアップロード直後に公開すると「No artifacts named github-pages」で失敗することがある（2026-11-25 発生）
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m affteam check --no-ai
      - run: python -m affteam build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
